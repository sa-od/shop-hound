<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Matches the header mark in app/components/Header.tsx: a lucide Radar
       glyph in emerald on a dark tile. Detail strokes from the full 24px icon
